networks:
  hacking_lab:
    driver: bridge

services:
  # ---------------- DATABASES ----------------

  vuln_mongodb:
    image: mongo:4.0
    container_name: lab_vuln_mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"
    command: mongod --auth --bind_ip_all
    networks:
      - hacking_lab
    restart: unless-stopped

  vuln_redis:
    image: redis:5.0
    container_name: lab_vuln_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass weakpass --protected-mode no
    networks:
      - hacking_lab
    restart: unless-stopped

  vuln_postgres:
    image: postgres:12
    container_name: lab_vuln_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=testdb
    ports:
      - "5432:5432"
    networks:
      - hacking_lab
    restart: unless-stopped

  vuln_mysql:
    image: mysql:5.7
    container_name: lab_vuln_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=vulnerable_db
      - MYSQL_USER=dbuser
      - MYSQL_PASSWORD=dbpass
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - hacking_lab
    restart: unless-stopped

  vuln_elasticsearch:
    image: elasticsearch:7.9.0
    container_name: lab_vuln_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - hacking_lab
    restart: unless-stopped

  vuln_couchdb:
    image: couchdb:3.1
    container_name: lab_vuln_couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    ports:
      - "5984:5984"
    networks:
      - hacking_lab
    restart: unless-stopped
